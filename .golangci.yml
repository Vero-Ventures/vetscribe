version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - gosec
    - govet
    - ineffassign
    - misspell
    - noctx
    - revive
    - staticcheck
    - unconvert
    - unused
  exclusions:
    rules:
      # httptest.NewRequest is the idiomatic test constructor; noctx is noise here.
      - path: _test\.go
        linters:
          - noctx

formatters:
  enable:
    - gofumpt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
