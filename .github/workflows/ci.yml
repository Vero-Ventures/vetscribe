name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: gofumpt (format)
        run: |
          go install mvdan.cc/gofumpt@latest
          test -z "$(gofumpt -l .)" || { echo "unformatted files:"; gofumpt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
      - name: Test (race + coverage)
        run: go test -race -shuffle=on -covermode=atomic -coverprofile=coverage.out ./...
      - name: Coverage floor 80%
        run: |
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "total coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN { exit (p+0 >= 80) ? 0 : 1 }' || { echo "coverage ${pct}% < 80%"; exit 1; }
      - name: Cross-compile (amd64 + arm64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./cmd/vetscribe
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./cmd/vetscribe
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  frontend:
    name: TypeScript frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests + coverage
        run: pnpm test
      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - name: Build frontend
        run: cd web && pnpm install --frozen-lockfile && pnpm build
      - name: Build binary
        run: CGO_ENABLED=0 go build -o vetscribe ./cmd/vetscribe
      - name: Install Playwright browsers
        run: cd web && pnpm exec playwright install --with-deps chromium firefox
      - name: Run server + e2e
        run: |
          ./vetscribe &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/healthz && break; sleep 1; done
          cd web && VETSCRIBE_BASE_URL=http://localhost:8080 pnpm e2e
