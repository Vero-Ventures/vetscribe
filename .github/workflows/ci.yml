name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: gofumpt (format)
        run: |
          go install mvdan.cc/gofumpt@latest
          test -z "$(gofumpt -l .)" || { echo "unformatted files:"; gofumpt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
      - name: Test (race)
        run: go test -race -shuffle=on ./...
      - name: Coverage floor 80% (logic packages)
        # cmd/vetscribe is thin wiring exercised by the browser e2e; the floor applies
        # to the internal logic packages.
        run: |
          go test -covermode=atomic -coverprofile=coverage.out ./internal/...
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "internal coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN { exit (p+0 >= 80) ? 0 : 1 }' || { echo "coverage ${pct}% < 80%"; exit 1; }
      - name: Cross-compile (amd64 + arm64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./cmd/vetscribe
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./cmd/vetscribe
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  e2e:
    name: End-to-end (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Install Chrome (for chromedp)
        uses: browser-actions/setup-chrome@v1
        with:
          install-dependencies: true
      - name: Build binary
        run: CGO_ENABLED=0 go build -o vetscribe ./cmd/vetscribe
      - name: Run server + chromedp e2e
        run: |
          ./vetscribe &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/healthz && break; sleep 1; done
          VETSCRIBE_BASE_URL=http://localhost:8080 go test -tags e2e ./internal/api/ -run TestE2E -v
