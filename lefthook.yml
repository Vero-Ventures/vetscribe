# Fast local gates. CI is authoritative; these catch issues before push.
pre-commit:
  parallel: true
  commands:
    gofumpt:
      glob: "*.go"
      run: gofumpt -l {staged_files} && test -z "$(gofumpt -l {staged_files})"
    go-vet:
      glob: "*.go"
      run: go vet ./...
    gitleaks:
      run: gitleaks git --staged --no-banner

pre-push:
  parallel: false
  commands:
    go-test:
      run: go test -race ./...
